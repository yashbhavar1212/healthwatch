{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="wrap login-wrap page-pad">
  <div class="login-side">
    <h1 class="h1">Sign in to report and review cases</h1>
    <p class="lead">Health workers log daily case counts. District officers see alerts, charts and trends.</p>
  </div>
  <form class="panel login-form" id="loginForm" data-next="{{ next }}" novalidate>
    <h2 class="h2">Welcome back</h2>
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <p class="form-error" id="loginError" role="alert" hidden></p>
    <button class="btn btn-solid btn-block" type="submit" id="loginBtn">Sign in</button>
  </form>
</section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/login.js') }}"></script>{% endblock %}
